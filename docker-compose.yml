name: ${COMPOSE_PROJECT_NAME:-task-agent}

x-app-base: &app-base
  image: ${APP_IMAGE:-task-agent:1.0.0}
  pull_policy: never

  restart: unless-stopped
  init: true
  working_dir: /app

  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  api:
    <<: *app-base

    env_file:
      - .env

    command:
      - python
      - -m
      - uvicorn
      - api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"

    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-8000}:8000"

    volumes:
      - type: bind
        source: .
        target: /app

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  ui:
    <<: *app-base

    environment:
      TASK_AGENT_API_URL: http://api:8000
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

    command:
      - python
      - -m
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false

    ports:
      - "${UI_BIND_IP:-0.0.0.0}:${UI_PORT:-8501}:8501"

    volumes:
      - type: bind
        source: .
        target: /app
        read_only: true

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
